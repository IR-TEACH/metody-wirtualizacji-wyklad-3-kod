name: stacja                      # stała nazwa projektu: stacja-backend, stacja_pgdata...

services:
  backend:
    build: ./backend              # bez ports: z zewnątrz tylko przez nginx
    environment:
      - DATABASE_URL=postgresql://stacja:${POSTGRES_PASSWORD}@db:5432/stacja
    depends_on:
      db: { condition: service_healthy }   # czekaj, aż baza będzie GOTOWA
    restart: unless-stopped       # proces padł: Docker uruchamia kontener ponownie
    healthcheck:                  # zdrowy = /health odpowiada (python, bo obraz nie ma curl)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s

  frontend:
    build: ./frontend
    ports: ["8080:80"]            # jedyne wejście do Stacji
    depends_on: [backend]

  sensor:
    build: ./sensor
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on: [backend]

  db:
    image: postgres:16-alpine     # obraz z półki
    environment:
      - POSTGRES_USER=stacja
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?brak pliku .env}   # z pliku .env
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:                  # jak Docker sprawdza, że baza przyjmuje połączenia
      test: ["CMD", "pg_isready", "-U", "stacja"]
      interval: 2s

volumes:
  pgdata:                         # wolumen nazwany: dane przeżyją usunięcie kontenera
