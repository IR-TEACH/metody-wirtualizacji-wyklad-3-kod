# Pipeline: build -> skan Trivy (bramka) -> push do GHCR z tagiem = SHA commita.
# Wdrożenie: na Wykładzie 4 klaster Kubernetes pobiera te obrazy.
name: obrazy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write              # push do ghcr.io tokenem GITHUB_TOKEN

jobs:
  obraz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        usluga: [backend, frontend, sensor]
    env:
      OBRAZ: ghcr.io/ir-teach/stacja-${{ matrix.usluga }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t $OBRAZ ./${{ matrix.usluga }}

      - name: Skan Trivy (CRITICAL z poprawką = stop)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.56.2 image --exit-code 1 --severity CRITICAL --ignore-unfixed $OBRAZ

      - name: Push do GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $OBRAZ
